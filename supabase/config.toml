project_id = "farmacova"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm", "https://farmacova.com/auth/callback", "https://farmacova.com/auth/confirm"]
enable_signup = true
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

# Correos en español con enlaces a /auth/confirm (funcionan en cualquier
# navegador). En el proyecto real se pegan en Authentication > Emails.
[auth.email.template.confirmation]
subject = "Confirma tu cuenta de Farmacova"
content_path = "./supabase/templates/confirmacion.html"

[auth.email.template.recovery]
subject = "Cambia tu contraseña de Farmacova"
content_path = "./supabase/templates/recuperacion.html"

[auth.email.template.email_change]
subject = "Confirma tu nuevo correo en Farmacova"
content_path = "./supabase/templates/cambio-correo.html"

# Verificación en dos pasos con app de autenticación (obligatoria para admins).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
